<!DOCTYPE html>
<html>
    <head>
        <title>Smokehouse Stock System</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
    <div class="layout">
        <nav class="sidebar">
            <div class="brand">Smokehouse</div>
            <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Dashboard</a>
            <a href="/stock" class="{{ 'active' if request.path == '/stock' else '' }}">Stock</a>
            <a href="/recipes" class="{{ 'active' if request.path == '/recipes' else '' }}">Recipes</a>
            <a href="/production" class="{{ 'active' if request.path == '/production' else '' }}">Production</a>
            <a href="/waste" class="{{ 'active' if request.path == '/waste' else '' }}">Waste</a>
            <a href="/costings" class="{{ 'active' if request.path == '/costings' else '' }}">Costings</a>
        </nav>
        <div class="main">
            <div class="content">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div> 
    <script src="{{ url_for ('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}   
    </body>
</html>
