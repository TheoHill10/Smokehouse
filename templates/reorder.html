{% extends "base.html" %}
{% block content %}
<h1>Reorder Check</h1>
{% if  reorder %}
<u1> 
    {% for ingredient, shortfall in reorder.items() %}
    <li>{{ ingredient }} is below minimum by {{ shortfall }}</li>
    {% endfor %}
</u1>
{% else %}
<p>Nothing needs to be reordered</p>
{% endif %}

{% endblock %}
